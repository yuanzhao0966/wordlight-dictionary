<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9ff">
  <meta name="description" content="词灯支持中英双向查词、拼写建议与双语例句。">
  <title>词灯 · 英汉词典</title>
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="app.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script defer src="featured.js"></script>
  <script defer src="lexicon.js"></script>
  <script defer src="chinese.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="./index.html" aria-label="词灯首页">
        <img src="icon-192.png" alt="" width="36" height="36">
        <span>词灯<span class="brand-sub">英汉词典</span></span>
      </a>
      <button id="install" class="install" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>安装应用</button>
    </div>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="heading">
      <h1 id="heading">英汉词典<span>.</span></h1>
      <p>输入英文或中文，查看释义、英文表达和双语例句。</p>
      <form id="lookup" role="search">
        <label class="sr" for="query">英文或中文词语</label>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></svg>
        <input id="query" type="search" placeholder="输入英文或中文词语…" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" aria-describedby="search-note">
        <button type="submit">查词</button>
      </form>
      <div class="samples" id="search-note">试试 <button type="button" data-word="light">light</button><button type="button" data-word="record">record</button><button type="button" data-word="谢谢">谢谢</button><button type="button" data-word="开心">开心</button><button type="button" data-word="recieve" class="typo">recieve <span>拼写示例</span></button></div>
    </section>
    <section id="results" class="results" aria-label="查词结果" aria-live="polite"></section>
    <noscript>请启用 JavaScript 以使用查词功能。</noscript>
    <footer><span>词灯 · 英汉词典</span><button id="sources" type="button">词库来源</button></footer>
  </main>
  <dialog id="info"><div class="dialog-head"><h2 id="dialog-title"></h2><form method="dialog"><button class="icon-button" aria-label="关闭">×</button></form></div><div id="dialog-copy"></div></dialog>
  <template id="audio-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12 0a4 4 0 0 1 0 6m2.4-8.5a7.5 7.5 0 0 1 0 11"/></svg></template>
</body>
</html>
